name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore VeterinaryClinic.slnx
      - name: Run unit tests
        run: dotnet test --solution VeterinaryClinic.slnx --configuration Release --no-restore
