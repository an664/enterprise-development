name: Tests

on:
  push:
    branches: [main, lab1, lab2, lab3]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore VeterinaryClinic.slnx
      - name: Set up Aspire
        run: dnx --yes aspire.cli@13.5.4 -- --nologo setup
      - name: Run tests
        run: dotnet test --solution VeterinaryClinic.slnx --configuration Release --no-restore
